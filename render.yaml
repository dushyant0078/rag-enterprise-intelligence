services:
  - type: web
    name: rag-enterprise-intelligence-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash startup.sh"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: RAG_PROCESSED_DIR
        value: /opt/render/project/src/data/processed
      - key: RAG_INDEX_DIR
        value: /opt/render/project/src/data/embeddings/faiss_index
      - key: RAG_RAW_UPLOAD_DIR
        value: /opt/render/project/src/data/raw/api_uploads
      - key: RAG_METADATA_DIR
        value: /opt/render/project/src/data/metadata
      - key: RAG_FEEDBACK_DIR
        value: /opt/render/project/src/data/feedback
      - key: RAG_TRACE_CONSOLE
        value: "false"
      - key: PYTHONPATH
        value: "."
      - key: API_ADMIN_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
