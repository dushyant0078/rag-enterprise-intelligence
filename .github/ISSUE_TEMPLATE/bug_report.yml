name: Bug report
description: Something in the pipeline, API, or dashboard isn't working as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, what actually happened.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Which component?
      options:
        - Ingestion / chunking / embeddings (Milestones 3-4)
        - Retrieval / reranking (Milestones 5-6)
        - Conversational pipeline / LLM (Milestone 7)
        - Evaluation framework (Milestone 8)
        - FastAPI backend (Milestone 9)
        - Streamlit dashboard (Milestone 10)
        - Monitoring / observability (Milestone 11)
        - Docker / Kubernetes (Milestone 12)
        - CI/CD (Milestone 13)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: config
    attributes:
      label: Configured backends
      description: Which embedding model / vector store / LLM / reranker were you running (see GET /model-info if using the API)?
      placeholder: e.g. TfidfEmbedding + FAISS + DeterministicTestLLM + LexicalOverlapReranker
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, requests, or UI actions — enough to reproduce from a clean checkout.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / traceback
      render: shell
