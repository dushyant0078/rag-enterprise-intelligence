apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: rag-enterprise-intelligence
  labels:
    app.kubernetes.io/name: rag-frontend
    app.kubernetes.io/part-of: rag-enterprise-intelligence
spec:
  # The frontend is stateless (session_state lives in each browser tab's Streamlit session,
  # not shared server state) -- safe to scale horizontally today, unlike the API. 2 replicas
  # by default for real availability during a pod restart/rollout.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-frontend
    spec:
      containers:
        - name: rag-frontend
          image: rag-enterprise-intelligence/frontend:latest
          ports:
            - containerPort: 8501
              name: http
          envFrom:
            - configMapRef:
                name: rag-frontend-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
