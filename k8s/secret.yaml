# TEMPLATE ONLY -- every value below is a placeholder. Never commit real secrets to source
# control; in a real deployment this file is generated by a secrets manager (Sealed Secrets,
# External Secrets Operator, Vault, or your platform's native secret injection) and applied
# separately, or built with `kubectl create secret generic ... --from-literal=...` directly
# against the cluster. Committing this file at all is itself a placeholder for that pipeline.
apiVersion: v1
kind: Secret
metadata:
  name: rag-api-secrets
  namespace: rag-enterprise-intelligence
type: Opaque
stringData:
  # Only the configured LLM backend needs its key -- see configs/llm/ and src/llm/registry.py.
  # Leaving these blank keeps the pipeline on DeterministicTestLLM, the same offline backend
  # every test in this repo runs against.
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GOOGLE_API_KEY: ""
  COHERE_API_KEY: ""
  # API key registry (src/security/api_auth.py) -- unset generates a random key at container
  # startup, printed nowhere by default; set these for stable keys across pod restarts/scaling.
  API_ADMIN_KEY: ""
  API_HR_KEY: ""
  # Optional: only needed if configs/vectorstore/ selects a hosted backend instead of the
  # default embedded FAISS index.
  QDRANT_API_KEY: ""
  WEAVIATE_API_KEY: ""
  PINECONE_API_KEY: ""
  LANGSMITH_API_KEY: ""
